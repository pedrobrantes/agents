# Reusable Lefthook template for agent-agnostic heavy checks outside AI loops.
# Copy to project root as `lefthook.yml` and run `lefthook install`.

pre-commit:
  parallel: true
  commands:
    secrets-scan:
      run: gitleaks protect --staged --no-banner
      skip:
        - run: "! command -v gitleaks >/dev/null 2>&1"
    python-lint:
      glob: "*.py"
      run: ruff check {staged_files}
      skip:
        - run: "! command -v ruff >/dev/null 2>&1"
    nix-parse:
      glob: "*.nix"
      run: for f in {staged_files}; do nix-instantiate --parse "$f" >/dev/null; done
      skip:
        - run: "! command -v nix-instantiate >/dev/null 2>&1"

pre-push:
  parallel: true
  commands:
    pytest:
      run: pytest -q
      skip:
        - run: "! [ -f pyproject.toml ] && ! [ -d tests ]"
    nix-flake-check:
      run: nix flake check
      skip:
        - run: "! [ -f flake.nix ]"
